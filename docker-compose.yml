services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hublify
      POSTGRES_PASSWORD: hublify
      POSTGRES_DB: hublify
    ports:
      - "${POSTGRES_PUBLISH:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hublify -d hublify"]
      interval: 5s
      timeout: 5s
      retries: 10
